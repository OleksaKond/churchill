<!DOCTYPE html>
<html lang="pl"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta name="robots" content="noindex"/>
<title>CHURCHILL — Kraków</title>
<script>
(function () {
  var supported = ['en', 'pl', 'ar', 'ru'];
  var def = 'pl';
  var lang = null;
  try {
    var stored = localStorage.getItem('churchill-lang');
    if (supported.indexOf(stored) >= 0) lang = stored;
  } catch (e) {}
  if (!lang) {
    var n = (navigator.language || '').slice(0, 2).toLowerCase();
    lang = supported.indexOf(n) >= 0 ? n : def;
  }
  location.replace(lang + '/');
})();
</script>
</head>
<body style="background:#0d151c;color:#e5e5e5;font-family:Inter,sans-serif;text-align:center;padding:4rem 1rem">
